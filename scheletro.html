<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicazione via Websocket - Graciolini & Baiocco</title>
  <link rel="stylesheet" href="style.css">
  <script>
    "use strict";

    let ws = new WebSocket("ws://10.1.0.52:8090/chat26/5i");

    ws.onopen = function() {
        let idUtente = "christian";
        let password = "123";
        ws.send("L|" + idUtente + "|" + password + "\n");
    };

    function gestoreRicezione(messaggioRicevuto){
        let data = messaggioRicevuto.data;
        let areaRicezione = document.getElementById("ricezione");

        if (data.startsWith("C|")) {
            areaRicezione.textContent += "[SISTEMA] " + data.substring(2);
        } else if (data.startsWith("M|")) {
            let parti = data.split("|");
            let mittente = parti[1];
            let corpo = parti[3];
            areaRicezione.textContent += mittente + ": " + corpo;
        } else if (data.startsWith("U|")) {
            let utenti = data.substring(2).trim().split("|").join(", ");
            areaRicezione.textContent += "[ONLINE] " + utenti + "\n";
        } else {
            areaRicezione.textContent += data;
        }

        areaRicezione.scrollTop = areaRicezione.scrollHeight;
    }

    ws.onmessage = gestoreRicezione;

    function inviaAlServer(){
        let campoMsg = document.getElementById("msg");
        let testo = campoMsg.value;

        if (testo !== "") {
            let idUtente = "christian";
            let timestamp = new Date().toISOString();
            let messaggioFormattato = "M|" + idUtente + "|" + timestamp + "|" + testo + "\n";

            ws.send(messaggioFormattato);
            campoMsg.value = "";
        }
    }

    function chiudiLaConnessione(){
        ws.close();
        document.getElementById("ricezione").textContent += "--- Connessione chiusa ---\n";
    }
  </script>
</head>
<body>

  <div class="chat-box">
    <h2>Comunicazione via Websocket</h2>

    <textarea id="ricezione" readonly></textarea>

    <div class="controlli">
      <input id="msg" type="text" placeholder="Scrivi un messaggio...">
      <button onClick="inviaAlServer()">Invia!</button>
      <button class="btn-chiudi" onClick="chiudiLaConnessione()">Chiudi</button>
    </div>
  </div>

</body>
</html>
