<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicazione via Websocket - Graciolini & Baiocco</title>
  <style>
    :root {
      --bg-dark: #070913;
      --glass-bg: rgba(18, 24, 43, 0.65);
      --glass-border: rgba(255, 255, 255, 0.15);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #9d00ff;
      --glow-cyan: 0 0 20px rgba(0, 243, 255, 0.4);
      --glow-pink: 0 0 20px rgba(255, 0, 127, 0.4);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-dark);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -2;
      animation: pulseOrbs 8s infinite alternate ease-in-out;
    }

    body::before {
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, var(--neon-purple), transparent 70%);
      top: -10%;
      left: -10%;
    }

    body::after {
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, var(--neon-cyan), transparent 70%);
      bottom: -10%;
      right: -10%;
      animation-delay: -4s;
    }

    @keyframes pulseOrbs {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      100% { transform: scale(1.2) translate(40px, 30px); opacity: 0.9; }
    }

    .chat-box {
      width: min(92vw, 500px);
      background: var(--glass-bg);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 18px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-align: center;
    }

    textarea#ricezione {
      width: 100%;
      height: 280px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      color: var(--neon-cyan);
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      padding: 14px;
      margin-bottom: 16px;
      resize: none;
      outline: none;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .controlli {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
      background: rgba(255, 255, 255, 0.08);
    }

    button {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(157, 0, 255, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    button.btn-chiudi {
      background: linear-gradient(135deg, #ff416c, var(--neon-pink));
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    button.btn-chiudi:hover {
      box-shadow: var(--glow-pink);
    }
  </style>

  <script>
    "use strict";

    let ws = new WebSocket("ws://10.1.0.52:8090/chat26/5i");

    function gestoreRicezione(messaggioRicevuto){
        let areaRicezione = document.getElementById("ricezione");
        areaRicezione.textContent += messaggioRicevuto.data + "\n";
        areaRicezione.scrollTop = areaRicezione.scrollHeight;
    }

    ws.onmessage = gestoreRicezione;

    function inviaAlServer(){
        let campoMsg = document.getElementById("msg");
        let messaggioDaInviare = campoMsg.value;
        if (messaggioDaInviare !== "") {
            ws.send(messaggioDaInviare);
            campoMsg.value = "";
        }
    }

    function chiudiLaConnessione(){
        ws.close();
        document.getElementById("ricezione").textContent += "--- Connessione chiusa ---\n";
    }
  </script>
</head>
<body>

  <div class="chat-box">
    <h2>Comunicazione via Websocket</h2>

    <textarea id="ricezione" readonly></textarea>

    <div class="controlli">
      <input id="msg" type="text" placeholder="Scrivi un messaggio...">
      <button onClick="inviaAlServer()">Invia!</button>
      <button class="btn-chiudi" onClick="chiudiLaConnessione()">Chiudi</button>
    </div>
  </div>

</body>
</html>
