<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat WebSocket - 5ª I</title>
  <link rel="stylesheet" href="style.css">
  <script>
    "use strict";

    /*const INDIRIZZO_SERVER = "ws://10.1.0.52:8090/chat26/5i";*/
    const INDIRIZZO_SERVER = "ws://10.3.1.174:8080";

    let ws = null;
    let autenticato = false;
    let nomeUtente = "";

    const el = id => document.getElementById(id);

    function scriviNellArea(riga) {
      const area = el("ricezione");
      area.textContent += riga + "\n";
      area.scrollTop = area.scrollHeight;
    }

    function mostraSchermata(nome) {
      el("login").style.display = (nome === "login") ? "block" : "none";
      el("chat").style.display  = (nome === "chat")  ? "block" : "none";
    }

    const costruisciLogin = (nome, psw) => "L|" + nome + "|" + psw + "\n";

    function costruisciMessaggio(nome, corpo) {
      return "M|" + nome + "|" + new Date().toISOString() + "|" + corpo + "\n";
    }

    function allaRicezione(evento) {
      const testo = evento.data.trim();

      if (!autenticato) {
        if (testo.includes("errat")) {
          el("errore").textContent = "Il server ha risposto: " + testo;
          return;
        }
        autenticato = true;
        el("errore").textContent = "";
        mostraSchermata("chat");
      }

      scriviNellArea("ricevuto ← " + testo);
    }

    function apriConnessione(primoMessaggio) {
      ws = new WebSocket(INDIRIZZO_SERVER);
      ws.onmessage = allaRicezione;
      ws.onclose = allaChiusura;
      ws.onerror = function() {
        el("errore").textContent = "Impossibile collegarsi al server (sei sulla rete della scuola?)";
      };
      ws.onopen = function() {
        ws.send(primoMessaggio);
      };
    }

    function allaChiusura() {
      if (autenticato) {
        autenticato = false;
        mostraSchermata("login");
        el("errore").textContent = "Connessione chiusa: rifai il login per rientrare";
      }
    }

    function accedi() {
      const nome = el("username").value.trim();
      const psw = el("password").value;

      if (nome === "" || psw === "") {
        el("errore").textContent = "Inserisci nome utente e password";
        return;
      }

      nomeUtente = nome;
      el("errore").textContent = "Login inviato, attendo la risposta del server...";
      const loginDaInviare = costruisciLogin(nome, psw);

      if (ws !== null && ws.readyState === WebSocket.OPEN) {
        ws.send(loginDaInviare);
      } else {
        apriConnessione(loginDaInviare);
      }
    }

    function inviaMessaggio() {
      const testo = el("msg").value.trim();
      if (testo === "") return;

      const messaggio = costruisciMessaggio(nomeUtente, testo);
      ws.send(messaggio);
      scriviNellArea("inviato → " + messaggio.trim());
      el("msg").value = "";
    }

    function esci() {
      if (ws !== null) {
        ws.close();
      }
    }

    // Gestione della pressione del tasto "Invio"
    document.addEventListener("DOMContentLoaded", function() {
      // Invio messaggio con Invio
      el("msg").addEventListener("keydown", function(evento) {
        if (evento.key === "Enter") {
          evento.preventDefault();
          inviaMessaggio();
        }
      });

      // Login con Invio nei campi di testo
      const gestioneLoginInvio = function(evento) {
        if (evento.key === "Enter") {
          evento.preventDefault();
          accedi();
        }
      };

      el("username").addEventListener("keydown", gestioneLoginInvio);
      el("password").addEventListener("keydown", gestioneLoginInvio);
    });
  </script>
</head>
<body>

  <div id="login" class="box">
    <h2>Login Chat WebSocket</h2>
    <input id="username" type="text" placeholder="Nome utente">
    <input id="password" type="password" placeholder="Password">
    <button onclick="accedi()">Entra</button>
    <div id="errore"></div>
  </div>

  <div id="chat" class="box" style="display:none">
    <textarea id="ricezione" readonly></textarea>
    <div class="riga">
      <input id="msg" type="text" placeholder="Scrivi un messaggio...">
      <button onclick="inviaMessaggio()">invia!</button>
      <button class="btn-chiudi" onclick="esci()">chiudi</button>
    </div>
  </div>

</body>
</html>
