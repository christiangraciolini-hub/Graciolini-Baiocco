<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat WebSocket - 5ª I</title>
  <link rel="stylesheet" href="style.css">
  <script>
    "use strict";

    // Indirizzo IP e porta del server WebSocket della scuola
    const INDIRIZZO_SERVER = "ws://10.1.0.52:8090/chat26/5i";

    // Variabili globali per la connessione e lo stato dell'utente
    let ws = null;
    let autenticato = false;
    let nomeUtente = "";

    // Funzione di utilità per selezionare velocemente gli elementi HTML tramite ID
    const el = id => document.getElementById(id);

    // Funzione per creare e inserire i fumetti dei messaggi nella chat con scorrimento automatico
    function aggiungiMessaggio(mittente, testo, tipo) {
      const area = el("ricezione");
      
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("messaggio", tipo);

      // Aggiunge il nome del mittente sopra il messaggio (se non è un messaggio di sistema)
      if (tipo !== "sistema") {
        const mittenteDiv = document.createElement("div");
        mittenteDiv.classList.add("mittente");
        mittenteDiv.textContent = mittente;
        msgDiv.appendChild(mittenteDiv);
      }

      const rigaDiv = document.createElement("div");
      rigaDiv.classList.add("contenuto-riga");

      const testoDiv = document.createElement("div");
      testoDiv.classList.add("testo");
      testoDiv.textContent = testo;

      // Genera l'orario corrente nel formato HH:MM
      const oraDiv = document.createElement("div");
      oraDiv.classList.add("ora");
      const adesso = new Date();
      oraDiv.textContent = adesso.getHours().toString().padStart(2, '0') + ":" + 
                           adesso.getMinutes().toString().padStart(2, '0');

      rigaDiv.appendChild(testoDiv);
      if (tipo !== "sistema") rigaDiv.appendChild(oraDiv);

      msgDiv.appendChild(rigaDiv);
      area.appendChild(msgDiv);

      // Scorrimento automatico verso il basso all'arrivo di un nuovo messaggio
      setTimeout(() => {
        area.scrollTop = area.scrollHeight;
      }, 50);
    }

    // Funzione per alternare la visibilità tra la schermata di login e la schermata di chat
    function mostraSchermata(nome) {
      el("login").style.display = (nome === "login") ? "flex" : "none";
      el("chat").style.display  = (nome === "chat")  ? "flex" : "none";
    }

    // Funzione per formattare la stringa di login secondo il protocollo (L|username|password)
    const costruisciLogin = (nome, psw) => "L|" + nome + "|" + psw + "\n";

    // Funzione per formattare la stringa del messaggio secondo il protocollo (M|username|data|testo)
    function costruisciMessaggio(nome, corpo) {
      return "M|" + nome + "|" + new Date().toISOString() + "|" + corpo + "\n";
    }

    // Funzione per gestire i dati e i messaggi ricevuti dal server WebSocket
    function allaRicezione(evento) {
      const testoGrezzo = evento.data.trim();

      // Gestione della risposta al primo tentativo di login
      if (!autenticato) {
        if (testoGrezzo.includes("errat")) {
          el("errore").textContent = "Errore: " + testoGrezzo;
          return;
        }
        autenticato = true;
        el("errore").textContent = "";
        mostraSchermata("chat");
      }

      // Separazione tra messaggi di testo standard e messaggi di controllo/sistema
      if (testoGrezzo.startsWith("M|")) {
        const parti = testoGrezzo.split("|");
        const mittente = parti[1] || "Utente";
        const contenuto = parti.slice(3).join("|");
        const tipo = (mittente === nomeUtente) ? "inviato" : "ricevuto";
        aggiungiMessaggio(mittente, contenuto, tipo);
      } else {
        aggiungiMessaggio("Sistema", testoGrezzo, "sistema");
      }
    }

    // Funzione per aprire la connessione WebSocket e inviare il pacchetto di login
    function apriConnessione(primoMessaggio) {
      ws = new WebSocket(INDIRIZZO_SERVER);
      ws.onmessage = allaRicezione;
      ws.onclose = allaChiusura;
      ws.onerror = function() {
        el("errore").textContent = "Errore connessione al server";
      };
      ws.onopen = function() {
        ws.send(primoMessaggio);
      };
    }

    // Funzione per gestire la disconnessione dal server e riportare l'utente al login
    function allaChiusura() {
      if (autenticato) {
        autenticato = false;
        mostraSchermata("login");
        el("errore").textContent = "Connessione chiusa.";
      }
    }

    // Funzione per convalidare i campi di testo ed effettuare il login
    function accedi() {
      const nome = el("username").value.trim();
      const psw = el("password").value;

      if (!nome || !psw) {
        el("errore").textContent = "Inserisci sia nome che password";
        return;
      }

      nomeUtente = nome;
      el("errore").textContent = "Connessione...";
      const loginDaInviare = costruisciLogin(nome, psw);

      if (ws !== null && ws.readyState === WebSocket.OPEN) {
        ws.send(loginDaInviare);
      } else {
        apriConnessione(loginDaInviare);
      }
    }

    // Funzione per inviare il messaggio scritto dall'utente al server WebSocket
    function inviaMessaggio() {
      const testo = el("msg").value.trim();
      if (!testo) return;

      const messaggio = costruisciMessaggio(nomeUtente, testo);
      ws.send(messaggio);
      el("msg").value = "";
    }

    // Funzione per chiudere manualmente il socket ed uscire dalla chat
    function esci() {
      if (ws !== null) ws.close();
    }

    // Inizializzazione degli eventi di ascolto tastiera (Invio) al caricamento della pagina
    document.addEventListener("DOMContentLoaded", function() {
      mostraSchermata("login");

      // Invio del messaggio premendo il tasto Invio nella chat
      el("msg").addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          inviaMessaggio();
        }
      });

      // Invio del form di login premendo Invio sui campi di testo
      const invioLogin = e => {
        if (e.key === "Enter") {
          e.preventDefault();
          accedi();
        }
      };

      el("username").addEventListener("keydown", invioLogin);
      el("password").addEventListener("keydown", invioLogin);
    });
  </script>
</head>
<body>

  <!-- Struttura della schermata di login iniziale -->
  <div id="login" class="box">
    <div class="login-content">
      <h2>Login Chat WebSocket</h2>
      <input id="username" type="text" placeholder="Nome utente">
      <input id="password" type="password" placeholder="Password">
      <button onclick="accedi()">Entra</button>
      <div id="errore"></div>
    </div>
  </div>

  <!-- Struttura della schermata della chat principale a tutto schermo -->
  <div id="chat" class="box" style="display:none">
    <!-- Intestazione superiore con titolo e tasto per uscire -->
    <div class="chat-header">
      <div class="info">
        <div class="avatar">5I</div>
        <div class="titolo">Classe 5ª I</div>
      </div>
      <button class="btn-chiudi" onclick="esci()">Esci</button>
    </div>

    <!-- Contenitore scrollabile dei fumetti di testo -->
    <div id="ricezione"></div>

    <!-- Barra inferiore per l'inserimento e l'invio del testo -->
    <div class="riga">
      <input id="msg" type="text" placeholder="Messaggio">
      <button onclick="inviaMessaggio()">Invia</button>
    </div>
  </div>

</body>
</html>
