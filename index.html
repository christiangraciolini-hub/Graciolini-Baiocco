<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat WebSocket - 5ª I</title>
  <link rel="stylesheet" href="style.css">
  <script>
    "use strict";

    const INDIRIZZO_SERVER = "ws://10.1.0.52:8090/chat26/5i";

    let ws = null;
    let autenticato = false;
    let nomeUtente = "";

    const el = id => document.getElementById(id);

    function aggiungiMessaggio(mittente, testo, tipo) {
      const area = el("ricezione");
      
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("messaggio", tipo);

      if (tipo !== "sistema") {
        const mittenteDiv = document.createElement("div");
        mittenteDiv.classList.add("mittente");
        mittenteDiv.textContent = mittente;
        msgDiv.appendChild(mittenteDiv);
      }

      const rigaDiv = document.createElement("div");
      rigaDiv.classList.add("contenuto-riga");

      const testoDiv = document.createElement("div");
      testoDiv.classList.add("testo");
      testoDiv.textContent = testo;

      const oraDiv = document.createElement("div");
      oraDiv.classList.add("ora");
      const adesso = new Date();
      oraDiv.textContent = adesso.getHours().toString().padStart(2, '0') + ":" + 
                           adesso.getMinutes().toString().padStart(2, '0');

      rigaDiv.appendChild(testoDiv);
      if (tipo !== "sistema") rigaDiv.appendChild(oraDiv);

      msgDiv.appendChild(rigaDiv);
      area.appendChild(msgDiv);

      // Auto-scroll automatico verso il basso ad ogni nuovo messaggio
      setTimeout(() => {
        area.scrollTop = area.scrollHeight;
      }, 50);
    }

    function mostraSchermata(nome) {
      el("login").style.display = (nome === "login") ? "flex" : "none";
      el("chat").style.display  = (nome === "chat")  ? "flex" : "none";
    }

    const costruisciLogin = (nome, psw) => "L|" + nome + "|" + psw + "\n";

    function costruisciMessaggio(nome, corpo) {
      return "M|" + nome + "|" + new Date().toISOString() + "|" + corpo + "\n";
    }

    function allaRicezione(evento) {
      const testoGrezzo = evento.data.trim();

      if (!autenticato) {
        if (testoGrezzo.includes("errat")) {
          el("errore").textContent = "Errore: " + testoGrezzo;
          return;
        }
        autenticato = true;
        el("errore").textContent = "";
        mostraSchermata("chat");
      }

      if (testoGrezzo.startsWith("M|")) {
        const parti = testoGrezzo.split("|");
        const mittente = parti[1] || "Utente";
        const contenuto = parti.slice(3).join("|");
        const tipo = (mittente === nomeUtente) ? "inviato" : "ricevuto";
        aggiungiMessaggio(mittente, contenuto, tipo);
      } else {
        aggiungiMessaggio("Sistema", testoGrezzo, "sistema");
      }
    }

    function apriConnessione(primoMessaggio) {
      ws = new WebSocket(INDIRIZZO_SERVER);
      ws.onmessage = allaRicezione;
      ws.onclose = allaChiusura;
      ws.onerror = function() {
        el("errore").textContent = "Errore connessione al server";
      };
      ws.onopen = function() {
        ws.send(primoMessaggio);
      };
    }

    function allaChiusura() {
      if (autenticato) {
        autenticato = false;
        mostraSchermata("login");
        el("errore").textContent = "Connessione chiusa.";
      }
    }

    function accedi() {
      const nome = el("username").value.trim();
      const psw = el("password").value;

      if (!nome || !psw) {
        el("errore").textContent = "Inserisci sia nome che password";
        return;
      }

      nomeUtente = nome;
      el("errore").textContent = "Connessione...";
      const loginDaInviare = costruisciLogin(nome, psw);

      if (ws !== null && ws.readyState === WebSocket.OPEN) {
        ws.send(loginDaInviare);
      } else {
        apriConnessione(loginDaInviare);
      }
    }

    function inviaMessaggio() {
      const testo = el("msg").value.trim();
      if (!testo) return;

      const messaggio = costruisciMessaggio(nomeUtente, testo);
      ws.send(messaggio);
      el("msg").value = "";
    }

    function esci() {
      if (ws !== null) ws.close();
    }

    document.addEventListener("DOMContentLoaded", function() {
      mostraSchermata("login");

      el("msg").addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          inviaMessaggio();
        }
      });

      const invioLogin = e => {
        if (e.key === "Enter") {
          e.preventDefault();
          accedi();
        }
      };

      el("username").addEventListener("keydown", invioLogin);
      el("password").addEventListener("keydown", invioLogin);
    });
  </script>
</head>
<body>

  <!-- SCHERMATA LOGIN -->
  <div id="login" class="box">
    <div class="login-content">
      <h2>Login Chat WebSocket</h2>
      <input id="username" type="text" placeholder="Nome utente">
      <input id="password" type="password" placeholder="Password">
      <button onclick="accedi()">Entra</button>
      <div id="errore"></div>
    </div>
  </div>

  <!-- SCHERMATA CHAT A TUTTO SCHERMO -->
  <div id="chat" class="box" style="display:none">
    <div class="chat-header">
      <div class="info">
        <div class="avatar">5I</div>
        <div class="titolo">Classe 5ª I</div>
      </div>
      <button class="btn-chiudi" onclick="esci()">Esci</button>
    </div>

    <div id="ricezione"></div>

    <div class="riga">
      <input id="msg" type="text" placeholder="Messaggio">
      <button onclick="inviaMessaggio()">Invia</button>
    </div>
  </div>

</body>
</html>
